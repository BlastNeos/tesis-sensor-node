services:
  meteo_db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${METEO_DB_NAME:-meteo_data}
      POSTGRES_USER: ${METEO_DB_USER:-meteo_app}
      POSTGRES_PASSWORD: ${METEO_DB_PASSWORD:-meteo_dev_password}

    volumes:
      - meteo_db_data:/var/lib/postgresql/data
      - ./init_meteo_data.sql:/docker-entrypoint-initdb.d/init_meteo_data.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${METEO_DB_USER:-meteo_app} -d ${METEO_DB_NAME:-meteo_data}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meteo_db_data: